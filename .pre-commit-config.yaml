default_stages:
  - pre-commit

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --verbose
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --config=pyproject.toml .
        language: system
        types_or: [python, pyi]

      - id: ty
        name: ty
        entry: uv run ty check ./src/r2x_sienna/
        language: system
        types: [python]
        pass_filenames: false

      - id: taplo-format
        name: taplo format
        entry: uvx --from taplo taplo fmt --check
        language: system
        types_or: [toml]

      - id: taplo-lint
        name: taplo lint
        entry: uvx --from taplo taplo check
        language: system
        types_or: [toml]

      - id: pytest
        name: pytest (quick)
        entry: uv run pytest -q -m "not slow" --maxfail=1 --disable-warnings --cov-fail-under=90
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: check-xml
      - id: mixed-line-ending
      - id: check-symlinks
      - id: detect-private-key
      - id: no-commit-to-branch
      - id: check-executables-have-shebangs

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.0
    hooks:
      - id: commitizen
        stages:
          - commit-msg

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.4
    hooks:
      - id: uv-lock
